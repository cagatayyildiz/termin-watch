name: check-termin
on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub's minimum; actual runs are often 5-15 min apart
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEADLINE: "2026-11-10"
